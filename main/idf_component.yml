## Dépendances managées (téléchargées par `idf.py reconfigure` / build) pour la
## carte Waveshare ESP32-S3-Touch-LCD-2.1 : écran ST7701 (RGB) + tactile CST820
## (pilote CST816S) + expander TCA9554, portés à LVGL 9 via esp_lvgl_port.
##
## Pas de BSP tout-en-un pour cette carte : le bring-up est fait dans
## main/board_display.c à partir des composants esp_lcd standard et du brochage
## officiel (cf. CLAUDE.md).
dependencies:
  idf:
    version: ">=5.3"
  lvgl/lvgl: "^9.2"
  espressif/esp_lvgl_port: "^2"
  espressif/esp_lcd_st7701: "^1"
  espressif/esp_lcd_panel_io_additions: "^1"
  espressif/esp_io_expander_tca9554: "^1"
  espressif/esp_lcd_touch_cst816s: "^1"
