## Dépendances managées (téléchargées par `idf.py reconfigure` / build).
##
## Le BSP de la carte Espressif ESP32-P4-Function-EV-Board tire lui-même
## LVGL 9.x et esp_lvgl_port, et configure l'écran MIPI-DSI (panneau EK79007,
## 1024x600) + le rétroéclairage. On garde ainsi le code applicatif concentré
## sur l'UI de la jauge.
##
## Autre carte P4 (Waveshare, M5Stack Tab5, ...) : remplacer la dépendance BSP
## par celle de la carte, l'API bsp_display_* reste identique.
dependencies:
  idf:
    version: ">=5.3"
  espressif/esp32_p4_function_ev_board: "^2"
